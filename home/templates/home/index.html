<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Уроки Django</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-body-tertiary">

    <div class="container py-5">
        <h1 class="mb-2">Уроки Django</h1>
        <p class="text-secondary mb-5">Учебный проект Zerocoder — по одному приложению на урок.</p>

        <div class="row g-4">
            {% for lesson in lessons %}
            <div class="col-md-6 col-lg-4">
                <div class="card h-100 shadow-sm">
                    <div class="card-body d-flex flex-column">
                        <h5 class="card-title">{{ lesson.title }}</h5>
                        <p class="card-text flex-grow-1">{{ lesson.desc }}</p>
                        <a href="{{ lesson.url }}" class="btn btn-primary mt-2">Открыть</a>
                    </div>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>

</body>
</html>
