<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}DJ05_3 — Profile{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
</head>
<body class="d-flex flex-column min-vh-100">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/" title="Ко всем урокам"><i class="bi bi-house-door-fill"></i></a>
            <a class="navbar-brand" href="{% url 'dj05_3:index' %}">DJ05_3 · Profile</a>
            <ul class="navbar-nav ms-auto align-items-lg-center">
                <li class="nav-item"><a class="nav-link" href="{% url 'dj05_3:index' %}">Главная</a></li>
                <li class="nav-item"><a class="nav-link" href="{% url 'dj05_3:profile' %}">Профиль</a></li>
                {% if user.is_authenticated %}
                    <li class="nav-item">
                        <form action="{% url 'dj05_3:logout' %}" method="post" class="d-inline">
                            {% csrf_token %}
                            <button type="submit" class="btn btn-outline-light btn-sm ms-lg-2">
                                Выйти ({{ user.username }})
                            </button>
                        </form>
                    </li>
                {% else %}
                    <li class="nav-item"><a class="nav-link" href="{% url 'dj05_3:login' %}">Войти</a></li>
                    <li class="nav-item"><a class="nav-link" href="{% url 'dj05_3:register' %}">Регистрация</a></li>
                {% endif %}
            </ul>
        </div>
    </nav>

    <main class="container my-5 flex-grow-1">
        {% block content %}{% endblock %}
    </main>

    <footer class="bg-dark text-light py-3 mt-auto">
        <div class="container text-center"><small>DJ05_3 (demo) — Profile через OneToOne, стандартный User не тронут</small></div>
    </footer>
</body>
</html>
