<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Раздел «Демо»</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-body-tertiary">

    <div class="container py-5">
        <h1 class="mb-2">Раздел «Демо»</h1>
        <p class="text-secondary mb-5">Объяснения «на пальцах». Живёт только в ветке <code>demo</code>.</p>

        <div class="row g-4">
            {% for demo in demos %}
            <div class="col-md-6 col-lg-4">
                <div class="card h-100 shadow-sm">
                    <div class="card-body d-flex flex-column">
                        <h5 class="card-title">{{ demo.title }}</h5>
                        <p class="card-text flex-grow-1">{{ demo.desc }}</p>
                        <a href="{{ demo.url }}" class="btn btn-primary mt-2">Открыть</a>
                    </div>
                </div>
            </div>
            {% endfor %}
        </div>

        <p class="mt-5"><a href="/">← на главную</a></p>
    </div>

</body>
</html>
